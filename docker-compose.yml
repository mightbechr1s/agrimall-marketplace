services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Mount your real config (with db creds + encryption key) over the placeholder.
      - ./config/config.php:/var/www/agrimall/config/config.php:ro
    environment:
      - TZ=Asia/Manila
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: agrimall
      MYSQL_USER: agrimall
      MYSQL_PASSWORD: change-me-app
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me-root"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dbdata:
