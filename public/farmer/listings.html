<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniMAL | My Listings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="farmer.css">
  <script src="farmer.js" defer></script>
</head>
<body>

<header><nav>
  <a class="brand" href="../index.html">AniMAL</a>
  <div class="links">
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="listings.html">My Listings</a>
    <a href="order-requests.html">Order Requests</a>
  </div>
  <a class="home" href="../index.html">← Marketplace</a>
</nav></header>

<main class="wrap">
  <div class="heading">
    <div>
      <span class="eyebrow">YOUR PRODUCE</span>
      <h1>My Listings</h1>
      <p class="muted"><span id="listingTotal">0</span> products listed · Manage your available produce.</p>
    </div>
    <button class="btn" onclick="addDialog.showModal()">＋ Add New Listing</button>
  </div>

  <section id="listingGrid" class="grid"></section>
</main>

<!-- ADD LISTING -->
<dialog id="addDialog">
  <div class="dialog-head">
    <div>
      <span class="eyebrow">YOUR PRODUCE</span>
      <h2>Add New Listing</h2>
      <p class="muted">Enter your product details before publishing.</p>
    </div>
    <button class="close" onclick="addDialog.close()">✕</button>
  </div>

  <form id="listingForm">
    <div class="listing-form-panel">

      <div class="listing-form-column">
        <label class="form-group">
          <span>Product Image</span>
          <span class="image-upload">
            <span id="uploadText">↑<br>Upload Image<br><small>Click to choose a photo</small></span>
            <img id="imagePreview" hidden>
          </span>
          <input id="productImage" name="image" type="file" accept="image/*" hidden>
        </label>

        <label class="form-group">Product Name
          <input name="name" placeholder="Enter product name" required>
        </label>

        <label class="form-group">Quantity
          <input name="stock" type="number" min="1" placeholder="Enter quantity" required>
        </label>

        <label class="form-group">Price
          <input name="price" type="number" min=".01" step=".01" placeholder="₱ 0.00" required>
        </label>
      </div>

      <div class="listing-form-column">
        <label class="form-group">Category
          <select name="category" required>
            <option value="">Select category</option>
            <option>Vegetables</option><option>Fruits</option>
            <option>Root Crops</option><option>Grains</option><option>Livestock</option>
          </select>
        </label>

        <label class="form-group">Unit
          <select name="unit" required>
            <option value="">Select unit</option>
            <option value="kg">Kilogram (kg)</option>
            <option value="piece">Piece</option>
            <option value="bundle">Bundle</option>
            <option value="sack">Sack</option>
          </select>
        </label>

        <label class="form-group">Availability Date
          <input name="availabilityDate" type="date" required>
        </label>

        <label class="form-group">Product Description
          <textarea name="description" placeholder="Enter product description" required></textarea>
        </label>
      </div>

    </div>

    <div class="listing-form-actions">
      <button type="button" class="btn cancel-listing" onclick="addDialog.close()">Cancel</button>
      <button class="btn">Publish Listing</button>
    </div>
  </form>
</dialog>

<!-- EDIT LISTING -->
<dialog id="editDialog">
  <div class="dialog-head">
    <div>
      <span class="eyebrow">MANAGE PRODUCE</span>
      <h2>Edit Listing</h2>
    </div>
    <button class="close" onclick="editDialog.close()">✕</button>
  </div>

  <form id="editForm">
    <div class="listing-form-panel">

      <div class="listing-form-column">
        <label class="form-group">Product Name
          <input name="name" required>
        </label>

        <label class="form-group">Quantity
          <input name="stock" type="number" min="0" required>
        </label>

        <label class="form-group">Price
          <input name="price" type="number" min=".01" step=".01" required>
        </label>
      </div>

      <div class="listing-form-column">
        <label class="form-group">Category
          <select name="category" required>
            <option>Vegetables</option><option>Fruits</option>
            <option>Root Crops</option><option>Grains</option><option>Livestock</option>
          </select>
        </label>

        <label class="form-group">Unit
          <select name="unit" required>
            <option value="kg">Kilogram (kg)</option>
            <option value="piece">Piece</option>
            <option value="bundle">Bundle</option>
            <option value="sack">Sack</option>
          </select>
        </label>

        <label class="form-group">Availability Date
          <input name="availabilityDate" type="date">
        </label>

        <label class="form-group">Description
          <textarea name="description"></textarea>
        </label>
      </div>

    </div>

    <div class="listing-form-actions">
      <button type="button" class="btn cancel-listing" onclick="editDialog.close()">Cancel</button>
      <button class="btn">Save Changes</button>
    </div>
  </form>
</dialog>

</body>
</html>
