<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Agrimall tractor mark</title>
  <!-- Rear wheel -->
  <circle cx="17" cy="46" r="12" fill="#1b4332"/>
  <circle cx="17" cy="46" r="6" fill="#f8f9fa"/>
  <circle cx="17" cy="46" r="2" fill="#1b4332"/>
  <!-- Front wheel -->
  <circle cx="46" cy="49" r="9" fill="#1b4332"/>
  <circle cx="46" cy="49" r="4.5" fill="#f8f9fa"/>
  <circle cx="46" cy="49" r="1.5" fill="#1b4332"/>
  <!-- Body / chassis -->
  <rect x="10" y="30" width="40" height="12" rx="2" fill="#1b4332"/>
  <!-- Cab -->
  <rect x="12" y="16" width="16" height="16" rx="2" fill="#1b4332"/>
  <!-- Cab window -->
  <rect x="14" y="18" width="12" height="9" rx="1" fill="#f8f9fa"/>
  <!-- Hood -->
  <rect x="30" y="22" width="18" height="10" rx="2" fill="#2d6a4f"/>
  <!-- Exhaust -->
  <rect x="26" y="10" width="3" height="10" rx="1" fill="#1b4332"/>
  <circle cx="27.5" cy="9" r="2" fill="#2d6a4f"/>
</svg>
