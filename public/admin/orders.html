<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniMAL - Orders</title>
<link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script>
</head>
<body>
<main>
 <a class="back" href="admin-dashboard.html">← Back to Dashboard</a>
 <span class="eyebrow">ADMIN</span><h1>Order Oversight</h1>
 <p class="subtitle">Monitor marketplace orders and intervene when necessary.</p>

 <section class="panel">
  <div class="panel-head"><h2>Marketplace Orders</h2></div>
  <div class="toolbar">
   <input id="orderSearch" type="search" placeholder="Search order, buyer, farmer or product...">
   <select id="orderStatus">
    <option>All</option><option>Pending</option><option>Awaiting Buyer</option>
    <option>Confirmed</option><option>Preparing</option><option>Ready for Pickup</option>
    <option>Out for Delivery</option><option>On Hold</option><option>Completed</option>
    <option>Rejected</option><option>Cancelled</option>
   </select>
  </div>
  <div class="table-wrap"><table>
   <thead><tr><th>Order ID</th><th>Buyer</th><th>Farmer</th><th>Product</th><th>Status</th><th>Admin Action</th></tr></thead>
   <tbody id="orderRows"></tbody>
  </table></div>
 </section>
</main>
</body>
</html>
