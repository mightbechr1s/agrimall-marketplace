<!DOCTYPE html>

<body>
<main>
 <a class="back" href="admin-dashboard.html">← Back to Dashboard</a>
 <span class="eyebrow">ADMIN</span>
 <h1>Farmer Verification Queue</h1>
 <p class="subtitle">Review farmer applications before granting marketplace access.</p>

 <section class="stats three">
  <div class="stat"><span class="stat-mark"></span><div><small>Pending Applications</small><b id="pendingCount">0</b></div></div>

 </section>

 <section class="panel">
  <div class="panel-head"><h2>Pending Farmer Applications</h2><a class="link" href="reports.html">View System Audit & Reports →</a></div>
  <div class="table-wrap"><table>
   <thead><tr><th>Farmer</th><th>Location</th><th>Status</th><th>Action</th></tr></thead>
   <tbody id="farmerRows"></tbody>
  </table></div>
 </section>
