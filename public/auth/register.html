
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniMAL | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ["Inter", "sans-serif"] },
      colors: { green: "#174D38", cream: "#FFF9EE" }
    }}};
  </script>
  <style>
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }
    @media (prefers-reduced-motion:reduce) {
      .fade-in { animation:none; }
    }
  </style>
</head>

<body class="bg-cream font-sans text-gray-900 min-h-screen">

  <!-- NAVIGATION -->
  <header class="w-[92%] max-w-[1400px] mx-auto py-3 flex items-center justify-between gap-4">
    <a href="../index.html" class="bg-green text-white font-bold px-6 py-2.5 rounded-lg">AniMAL</a>
    <a href="../index.html" class="text-green text-sm font-semibold hover:underline">← Back to Marketplace</a>
  </header>

  <!-- CENTERED TWO-COLUMN LAYOUT -->
  <main class="w-[92%] max-w-[1400px] mx-auto min-h-[calc(100dvh-68px)] grid lg:grid-cols-2 gap-6 lg:gap-10 items-center py-2">

    <!-- LEFT: CENTERED LOGO AND TEXT -->
    <section class="fade-in bg-[#F2F8F0] rounded-3xl min-h-[280px] lg:h-[550px] flex items-center justify-center p-6">
      <div class="flex flex-col items-center justify-center text-center">
        <img src="../images/animal-logo.png" alt="AniMAL Logo"
             class="w-32 h-32 md:w-40 md:h-40 object-contain">

        <p class="text-lg md:text-xl text-gray-800 mt-2">
          Philippine Agricultural Marketplace
        </p>

        <div class="w-14 h-1 rounded-full bg-green/40 my-4"></div>

        <p class="text-green italic text-base md:text-lg">
          Fresh produce, direct from local farmers.
        </p>
      </div>
    </section>

    <section class="fade-in w-full flex items-center justify-center py-2">
      <div class="bg-white border border-green/10 shadow-lg shadow-green/5 rounded-3xl p-5 sm:p-7 w-full max-w-[470px]">

        <h1 class="text-2xl font-bold text-green">Create an Account</h1>
        <p class="text-gray-500 text-sm mt-1 mb-3">Join AniMAL as a buyer or farmer.</p>

        <form action="#" method="POST" id="registerForm" class="space-y-2">

          <div>
            <label for="fullname" class="block text-sm font-semibold mb-1">Full Name</label>
            <div class="relative">
              <i data-lucide="user-round" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
              <input id="fullname" name="fullname" type="text" autocomplete="name" required
                     placeholder="Enter your full name"
                     class="w-full border border-gray-200 rounded-lg py-2 pl-10 pr-3 outline-none focus:border-green focus:ring-2 focus:ring-green/15">
            </div>
          </div>

          <div>
            <label for="email" class="block text-sm font-semibold mb-1">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
              <input id="email" name="email" type="email" autocomplete="email" required
                     placeholder="Enter your email address"
                     class="w-full border border-gray-200 rounded-lg py-2 pl-10 pr-3 outline-none focus:border-green focus:ring-2 focus:ring-green/15">
            </div>
          </div>

          <div>
            <label for="username" class="block text-sm font-semibold mb-1">Username</label>
            <div class="relative">
              <i data-lucide="user-round" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
              <input id="username" name="username" type="text" autocomplete="username" required
                     placeholder="Choose a username"
                     class="w-full border border-gray-200 rounded-lg py-2 pl-10 pr-3 outline-none focus:border-green focus:ring-2 focus:ring-green/15">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold mb-1">Password</label>
            <div class="relative">
              <i data-lucide="lock-keyhole" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
                     placeholder="Create a password"
                     class="w-full border border-gray-200 rounded-lg py-2 pl-10 pr-3 outline-none focus:border-green focus:ring-2 focus:ring-green/15">
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-semibold mb-1">Confirm Password</label>
            <div class="relative">
              <i data-lucide="lock-keyhole" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
              <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required
                     placeholder="Confirm your password"
                     class="w-full border border-gray-200 rounded-lg py-2 pl-10 pr-3 outline-none focus:border-green focus:ring-2 focus:ring-green/15">
            </div>
          </div>

          <!-- BUYER / FARMER SELECTION -->
          <fieldset class="pt-1">
            <legend class="text-sm font-semibold text-center w-full mb-2">I am a...</legend>
            <div class="flex justify-center gap-3">

              <label class="cursor-pointer">
                <input type="radio" name="role" value="buyer" required class="peer sr-only">
                <span class="flex items-center gap-2 px-6 py-2 bg-gray-50 border border-gray-200 rounded-lg peer-checked:bg-green peer-checked:text-white peer-checked:border-green transition">
                  <i data-lucide="shopping-cart" class="w-4 h-4"></i> Buyer
                </span>
              </label>

              <label class="cursor-pointer">
                <input type="radio" name="role" value="farmer" required class="peer sr-only">
                <span class="flex items-center gap-2 px-6 py-2 bg-gray-50 border border-gray-200 rounded-lg peer-checked:bg-green peer-checked:text-white peer-checked:border-green transition">
                  <i data-lucide="user-round" class="w-4 h-4"></i> Farmer
                </span>
              </label>

            </div>
          </fieldset>

          <p id="errorMessage" class="text-red-600 text-sm hidden" role="alert">
            Passwords do not match.
          </p>

          <button type="submit" class="w-full bg-green text-white font-semibold py-2.5 rounded-lg hover:bg-[#236448] transition">
            Register
          </button>
        </form>

        <p class="text-sm text-center text-gray-600 mt-3">
          Already have an account?
          <a href="login.html" class="text-green font-semibold hover:underline">Log in here</a>
        </p>
      </div>
    </section>

  </main>

  <script>
    if (window.lucide) lucide.createIcons();

    document.getElementById("registerForm").addEventListener("submit", function (event) {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const error = document.getElementById("errorMessage");

      if (password !== confirm) {
        event.preventDefault();
        error.classList.remove("hidden");
      } else {
        error.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
