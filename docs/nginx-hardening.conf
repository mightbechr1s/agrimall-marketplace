# AgriMALL - Nginx hardening
#
# Apache reads public/.htaccess and public/uploads/.htaccess. Nginx reads
# neither. If this app is ever deployed on Nginx, the uploads directory has
# NO execution protection unless the equivalent rules below are added, which
# would re-open remote code execution through uploaded files.
#
# Add inside the `server { }` block that serves public/.

# Do not advertise the PHP version.
server_tokens off;

# Deny dotfiles (.htaccess, .env, editor backups) everywhere.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# public/ must not be uploaded files' execution surface. Mirrors
# public/uploads/.htaccess: the directory may exist and hold images, but no
# file inside it may be interpreted as code.
location ^~ /uploads/ {
    location ~* \.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Images are uploaded by the app, so they are static content.
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    try_files $uri =404;
}

# Only front controllers may execute PHP. Everything else in public/ is denied.
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 30s;
}
